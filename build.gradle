plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.72'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'LocalSeed'
        url = uri('file:///D:/Deepseek/local-m2')
    }
    maven {
        name = 'NeoForged'
        url = uri('https://maven.neoforged.net/releases')
    }
    maven {
        name = 'AliyunPublic'
        url = uri('https://mirrors.aliyun.com/repository/public')
    }
    maven {
        name = 'HuaweiCloud'
        url = uri('https://mirrors.huaweicloud.com/repository/maven/')
    }
    mavenCentral()
    mavenLocal()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}