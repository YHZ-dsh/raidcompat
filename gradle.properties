org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# The sandbox denies the native file-watcher thread handle; turn it off.
org.gradle.vfs.watch=false

# Long timeouts + extra retries: several hosts drop TLS handshakes now and then.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000

# 1.21.1 target
minecraft_version=1.21.1
neo_version=21.1.72

mod_id=raidcompat
mod_version=1.0.0
mod_group_id=com.example.raidcompat